# "CI gate" is the one check for branch protection to require. It always reports,
# and it passes only when every job the change needs has passed, so a skipped
# build can never stand in for a green one. See docs/windows.md, "Continuous
# integration".
name: CI

on:
  pull_request:
    # "edited" covers a changed base branch: a retargeted PR is classified again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A PR's newer run replaces its older one; every push to main keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  classify:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Documentation-only means every changed path is Markdown outside .github/.
      # Anything else, an empty diff or an unusable base takes the build path.
      - id: scope
        run: |
          docs_only=false
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git -c core.quotepath=off diff --name-only --no-renames \
              "$BASE_SHA...$HEAD_SHA" > changed.txt
            not_docs=$(grep -Ev '\.md$' changed.txt || true)
            ci_files=$(grep -E '^\.github/' changed.txt || true)
            if [ -s changed.txt ] && [ -z "$not_docs" ] && [ -z "$ci_files" ]; then
              docs_only=true
            fi
            {
              echo "### Changed files ($(wc -l < changed.txt))"
              echo '```'
              cat changed.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No usable base commit '$BASE_SHA'; taking the build path." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "Documentation-only: $docs_only" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  docs:
    name: Docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Internal links and the CLAUDE.md import of AGENTS.md
        run: python3 scripts/check_docs.py
      - name: Whitespace errors and conflict markers in changed lines
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            echo "No usable base commit '$BASE_SHA'; nothing to compare."
          fi

  # No job name: a skipped matrix job would report its unexpanded name, so the
  # checks read "windows (Debug)", "windows (Release)" or a skipped "windows".
  windows:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    # CMakePresets.json names the Visual Studio 2022 generator; newer images
    # carry Visual Studio 2026 instead, so the image moves with the preset.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake --preset windows
      - run: cmake --build --preset windows --config ${{ matrix.configuration }} --parallel
      # Tests labelled "desktop" open the real graph-editor window; they are
      # verified locally until a hosted runner proves them reliable.
      - run: ctest --preset windows --build-config ${{ matrix.configuration }} --label-exclude desktop

  # The web build (docs/web.md): Emscripten builds every target, CTest runs the web scope
  # under emsdk's Node, and the module's files and manifest are uploaded for a client.
  web:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    env:
      # The one place the Emscripten version is pinned: the emsdk tag, the SDK it installs,
      # and the commit that tag must resolve to. They move together, in one pull request.
      EMSCRIPTEN_VERSION: 6.0.13
      EMSDK_COMMIT: 35659964bc2762fffec0d257997fb61475f765b7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Outside the checkout, so the tree the module is built from stays clean. No cache.
      - name: Install Emscripten ${{ env.EMSCRIPTEN_VERSION }}
        run: |
          emsdk="$RUNNER_TEMP/emsdk"
          git -c advice.detachedHead=false clone --depth 1 --branch "$EMSCRIPTEN_VERSION" \
            https://github.com/emscripten-core/emsdk.git "$emsdk"
          tagged=$(git -C "$emsdk" rev-parse HEAD)
          if [ "$tagged" != "$EMSDK_COMMIT" ]; then
            echo "::error::emsdk tag $EMSCRIPTEN_VERSION is $tagged, not $EMSDK_COMMIT."
            exit 1
          fi
          "$emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      # emsdk_env.sh sets EMSDK and EMSDK_NODE, which the web presets read, for one step.
      - name: Configure
        run: |
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --preset web
      - name: Build
        run: |
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --build --preset web
      - name: Test under Node
        run: |
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ctest --preset web
      - name: Show the manifest
        run: |
          {
            echo '### Web module manifest'
            echo '```json'
            cat build/web/dist/modular.manifest.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # dist/ holds exactly the files the manifest lists and the manifest, as the smoke test
      # checks. A PR's run builds GitHub's merge of the branch into main, so its commit is
      # that merge; a client takes the artifact of a push to main.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modular-web-${{ github.sha }}
          path: build/web/dist/
          if-no-files-found: error

  gate:
    name: CI gate
    # Not !cancelled(): a cancelled run would then leave the gate skipped, and
    # branch protection counts a skipped required check as passing.
    if: always()
    needs: [classify, docs, windows, web]
    runs-on: ubuntu-latest
    steps:
      - env:
          CLASSIFY: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          DOCS: ${{ needs.docs.result }}
          BUILD: ${{ needs.windows.result }}
          WEB: ${{ needs.web.result }}
        run: |
          echo "classify=$CLASSIFY docs_only=$DOCS_ONLY docs=$DOCS build=$BUILD web=$WEB"
          [ "$CLASSIFY" = success ] || { echo "::error::Change classification did not succeed."; exit 1; }
          [ "$DOCS" = success ] || { echo "::error::Docs checks did not succeed."; exit 1; }
          if [ "$DOCS_ONLY" = true ]; then
            case "$BUILD" in success|skipped) ;; *) echo "::error::Build result: $BUILD."; exit 1 ;; esac
            case "$WEB" in success|skipped) ;; *) echo "::error::Web build result: $WEB."; exit 1 ;; esac
            echo "Documentation-only change: links, whitespace and changed-file scope passed."
          else
            [ "$BUILD" = success ] || { echo "::error::Windows Debug/Release build and tests: $BUILD."; exit 1; }
            [ "$WEB" = success ] || { echo "::error::Web build and tests under Node: $WEB."; exit 1; }
            echo "Code path: Windows Debug and Release builds, headless CTest and the web build passed."
          fi
